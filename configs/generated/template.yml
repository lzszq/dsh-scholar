# DSH Scholar canonical config template (CONFIG-01).
# GENERATED from packages/research-schemas/src/config-registry.ts — do not edit by hand.
# Effective config = defaults + overrides, merged/validated/pinned by validateConfig().
# Secret keys are never echoed in plaintext output; they only enter the one-way pin hash.

global:
  images_lock:
    # Trusted image digest lock file (RUN-02): overridable via DSH_IMAGES_LOCK.
    # sources: env/file
    path: configs/runner-profiles/images.lock.json
    # Pinned node fixture digest — must equal the images.lock node_fixture entry.
    # sources: file; security-floor
    node_fixture: node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    # Pinned TeX Live digest — must equal the images.lock texlive entry.
    # sources: file; security-floor
    texlive: texlive/texlive@sha256:8957c916b8160049f89c24d362a6d86c09d8a04095acde37e88404c4afed85b4

project:
  execution:
    # Explicit opaque registered RunnerProfile id. null means an unconfigured DRAFT and is never resolved to a local runner implicitly; execution remains blocked until Settings saves a registered id.
    # sources: http/ui/file
    runner_profile_id: null
    # Opaque registered RunnerTarget id. The registry resolves local-process/local-docker/remote-ssh connection metadata server-side and pins its revision/hash at job submission.
    # sources: http/ui/file
    runner_target_id: target_local_docker_v1
    # Runner network policy; `none` forbids any container network other than none.
    # sources: http/ui/file; security-floor
    network_policy: allowlist
    # Artifact store backing the project.
    # sources: http/ui/file
    artifact_store: local-cas
    # Registered FixtureProfile id for full-auto projects (reconstruction-contracts.md §5); full-auto without a registered fixture is rejected at project create and job submit.
    # sources: http/ui/file
    fixture_id: null
  integrity:
    # Baseline reproduction is required before experiments.
    # sources: http/ui/file
    require_baseline_reproduction: true
    # Approved experiment contracts are required for formal runs.
    # sources: http/ui/file
    require_experiment_contract: true
    # Claims must link accepted evidence.
    # sources: http/ui/file
    require_claim_evidence_links: true
    # Release requires a clean-room rerun.
    # sources: http/ui/file
    require_clean_room_rerun: false
    # Automatic public release is forbidden by the security baseline (§1); the Release Gate is the only path.
    # sources: http/ui/file; security-floor
    allow_automatic_public_release: false
    # Project-level manifest signature requirement (§12.7); the kernel-level default is true.
    # sources: http/ui/file
    require_signed_manifest: false

job:
  # reserved scope — no keys yet (per-job policy is derived from runner-profile + job payload).
runner-profile:
  runner:
    # Kernel endpoint the runner claims jobs from.
    # sources: cli/env/file
    kernel: http://127.0.0.1:7412
    # Execution mode; formal kinds are container-only (runtime enforced, execution-runtime.md §1).
    # sources: cli/env/file; security-floor
    mode: subprocess
    # Poll interval between claim cycles.
    # sources: cli/env/file
    poll_ms: 2000
    # Per-job execution timeout.
    # sources: cli/env/file
    timeout_ms: 60000
    # Lease heartbeat interval while a job executes.
    # sources: cli/env/file
    heartbeat_ms: 15000
    # Cancel-watcher poll interval (terminates the real execution).
    # sources: cli/env/file
    cancel_poll_ms: 5000
    # Lease owner identity; a random runner-<id> is generated when empty.
    # sources: cli/env/file
    owner: ''
    # Ed25519 signing key file (0600); an ephemeral key is generated when absent.
    # sources: cli/env/file
    key_file: ''
    # Kernel bearer token for the runner client; injected by environment or a managed 0600 config file, never argv.
    # sources: env/file; secret
    token: ''
    # Service identity for internal kernel routes; never argv.
    # sources: env/file; secret
    service_token: ''
    # Target-scoped service identity for RunnerTarget heartbeat; independent from the shared internal-route token and never argv.
    # sources: env/file; secret
    target_token: ''
    # Fleet server listen port (0 = ephemeral); when provided the runner runs RemoteFleetServer instead of the local claim loop.
    # sources: cli/env/file
    fleet_server_port: 0
    # Fleet server base URL; when provided the runner runs as a remote fleet agent instead of the local claim loop.
    # sources: cli/env/file
    fleet_url: ''
    # Agent identity registered with the fleet server; generated agent-<id> when empty.
    # sources: cli/env/file
    agent_id: ''
    # Opaque target id used for exact-match dispatch. Local mode defaults by mode to target_local_process_v1 or target_local_docker_v1; fleet agents must advertise their configured target.
    # sources: cli/env/file
    fleet_target_id: ''
    # Path to the fleet server plan-signing public key PEM; agents refuse unverifiable plans without it (fail closed).
    # sources: cli/env/file
    fleet_public_key: ''
    # Remote-SSH RunnerTarget id to connect and bootstrap as a fleet agent; empty disables SSH bootstrap.
    # sources: cli/env/file
    ssh_bootstrap_target: ''
    # Server-only root used to resolve file SecretRefs for remote-SSH bootstrap; never sent to the browser or remote host.
    # sources: cli/env/file
    secret_root: ''
    # SSH connection/bootstrap timeout in milliseconds.
    # sources: cli/env/file
    ssh_connect_timeout_ms: 15000
    # Container network mode; `host` is forbidden by the security floor and `network_policy=none` allows only `none`.
    # sources: file/http/ui; security-floor
    network: none
    # Privileged containers are forbidden by the security floor.
    # sources: file/http/ui; security-floor
    privileged: false
    # Docker socket mounts are forbidden by the security floor.
    # sources: file/http/ui; security-floor
    docker_socket: false

orchestrator:
  # Kernel endpoint the orchestrator advances projects over.
  # sources: cli/env/file
  kernel: http://127.0.0.1:7412
  # SQLite action-store path; empty = ephemeral temp database.
  # sources: cli/env/file
  db: ''
  # Poll interval between advancement rounds (bin still requires > 0).
  # sources: cli/env/file
  poll_ms: 5000
  # Run a single poll round and exit (tests/cron).
  # sources: cli
  once: false
  # Compute planned actions only; no kernel writes, no persistence.
  # sources: cli
  dry_run: false
  # Leader-election owner id for orchestrator_leases (reconstruction-contracts.md §15); empty = orch-<hostname>-<pid>.
  # sources: cli
  owner: ''
  # orchestrator_leases expiry in seconds (§15); the owning instance refreshes every poll round and releases on close.
  # sources: cli
  lease_seconds: 60
  # 0600 file with the kernel bearer token; every kernel request carries Authorization: Bearer <token>.
  # sources: cli/file
  token_file: ''

kernel:
  # Kernel HTTP listen host.
  # sources: cli/env/file
  host: 127.0.0.1
  # Kernel HTTP listen port (0 = ephemeral, published via endpoint file).
  # sources: cli/env/file
  port: 7412
  # Kernel bearer token; supplied only through environment or managed config files, never argv.
  # sources: env/file; secret
  token: ''
  # Internal-route service identity (x-service-token); never accepted on argv.
  # sources: env/file; secret
  service_token: ''
  # SQLite database path; empty = ephemeral temp database.
  # sources: cli/env/file
  db: ''
  # CAS root for immutable artifacts.
  # sources: cli/env/file
  cas: .research-cas
  # Server-only SecretRef root for target identities, model credentials and SSH connection material; never returned in plaintext.
  # sources: cli/env/file; secret
  secret_root: ''
  # 0600 endpoint identity file written after bind (SIDE-01).
  # sources: cli/env/file
  endpoint_file: ''
  # Reject unsigned run manifests at completion (RUN-01: default true).
  # sources: file/http/ui; security-floor
  require_signed_manifest: true
  # Idle lifetime in seconds pinned into each newly opened PTY session; existing sessions are unchanged.
  # sources: file/http/ui
  pty_idle_ttl_s: 900
  # Bounded output bytes pinned into each newly opened PTY session; existing replay windows are unchanged.
  # sources: file/http/ui
  pty_retention_bytes: 1048576
  # Lease lifetime in seconds pinned into each newly opened PTY session; existing lease expiry is unchanged.
  # sources: file/http/ui
  pty_lease_ttl_s: 3600

standalone:
  # Standalone BFF listen host.
  # sources: cli/env/file
  host: 127.0.0.1
  # Standalone BFF listen port.
  # sources: cli/env/file
  port: 18610
  # Shared Research Kernel port used by both DSH and the standalone BFF.
  # sources: cli/env/file
  kernel_port: 7412
  # Authoritative shared Kernel data directory; empty = $DSH_HOME/research-kernel or ~/.dsh/research-kernel.
  # sources: cli/env/file
  kernel_data_dir: ''
  # Standalone BFF state directory (browser token/session/model only); empty = $DSH_HOME/research-ui-standalone or ~/.dsh-scholar-standalone/research-ui-standalone.
  # sources: cli/env/file
  data_dir: ''
  # Loopback bearer token; auto-generated and persisted in a 0600 managed file, never argv.
  # sources: file; secret
  token: ''
  # Operator principal identity (GOV-01 local resolver).
  # sources: cli/file
  principal: ''
  # Comma-separated exact HTTPS or loopback-HTTP DSH origins allowed by CSP frame-ancestors; no wildcard, path, query, fragment, or credentials.
  # sources: cli/env/file; security-floor
  frame_ancestors: "http://127.0.0.1:3080,http://localhost:3080,http://[::1]:3080"
  # Tokenless mode — loopback bind only (127.0.0.0/8, ::1, localhost).
  # sources: cli/file; security-floor
  no_token: false
